services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      # Keep the container's node_modules isolated from the bind mount so the
      # host (sandbox) doesn't need a native install.
      - web_node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      # Vite >= 6.1 appends this to its allowedHosts; the platform sets it to
      # the preview's external hostname so HMR/dev assets load in the iframe.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 5173"
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5173/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s

volumes:
  web_node_modules:
