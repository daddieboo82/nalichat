trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  NODE_VERSION: '22.x'

jobs:
  - job: verify
    displayName: Verify application
    timeoutInMinutes: 25
    steps:
      - checkout: self
        clean: true

      - task: NodeTool@0
        displayName: Use Node.js 22
        inputs:
          versionSpec: $(NODE_VERSION)

      - script: npm ci
        displayName: Install dependencies

      - script: npm run lint
        displayName: Lint

      - script: npm run typecheck
        displayName: Type check

      - script: npm test -- --run
        displayName: Unit tests

      - script: npm run build
        displayName: Production build

  - job: browser_smoke
    displayName: Browser smoke
    timeoutInMinutes: 25
    steps:
      - checkout: self
        clean: true

      - task: NodeTool@0
        displayName: Use Node.js 22
        inputs:
          versionSpec: $(NODE_VERSION)

      - script: npm ci
        displayName: Install dependencies

      - script: npx playwright install --with-deps chromium
        displayName: Install Chromium

      - script: npm run test:e2e
        displayName: Run browser smoke tests

  - job: production_authenticated_e2e
    displayName: Production authenticated E2E
    timeoutInMinutes: 25
    variables:
      E2E_BASE_URL: https://nalichat.org
    steps:
      - checkout: self
        clean: true

      - task: NodeTool@0
        displayName: Use Node.js 22
        inputs:
          versionSpec: $(NODE_VERSION)

      - script: |
          test -n "$E2E_USER_EMAIL"
          test -n "$E2E_USER_PASSWORD"
          test -n "$E2E_SECOND_USER_EMAIL"
          test -n "$E2E_SECOND_USER_PASSWORD"
        displayName: Require production E2E credentials
        env:
          E2E_USER_EMAIL: $(E2E_USER_EMAIL)
          E2E_USER_PASSWORD: $(E2E_USER_PASSWORD)
          E2E_SECOND_USER_EMAIL: $(E2E_SECOND_USER_EMAIL)
          E2E_SECOND_USER_PASSWORD: $(E2E_SECOND_USER_PASSWORD)

      - script: npm ci
        displayName: Install dependencies

      - script: npx playwright install --with-deps chromium
        displayName: Install Chromium

      - script: npm run test:e2e -- e2e/authenticated-smoke.spec.js --project=mobile-chromium --project=iphone-16-simulation
        displayName: Run authenticated production E2E
        env:
          E2E_BASE_URL: $(E2E_BASE_URL)
          E2E_USER_EMAIL: $(E2E_USER_EMAIL)
          E2E_USER_PASSWORD: $(E2E_USER_PASSWORD)
          E2E_SECOND_USER_EMAIL: $(E2E_SECOND_USER_EMAIL)
          E2E_SECOND_USER_PASSWORD: $(E2E_SECOND_USER_PASSWORD)
