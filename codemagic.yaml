# NaliChat - Codemagic CI/CD Configuration
# Builds a signed Android App Bundle (.aab) via Bubblewrap (TWA)
# Package ID: com.nalichat | Host: nalichat.org

workflows:
  android-aab:
    name: NaliChat Android AAB
    max_build_duration: 30
    environment:
      groups:
        - keystore_credentials
      vars:
        PACKAGE_ID: com.nalichat
        KEYSTORE_ALIAS: nalichat
      node: 20
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: false
      cancel_previous_builds: true
    scripts:
      - name: Install Bubblewrap CLI
        script: |
          npm install -g @bubblewrap/cli
      - name: Prepare Android SDK (licenses + components)
        script: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/share/android-sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME" -name "sdkmanager" -type f 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
            echo "✅ SDK licenses accepted, components installed at $ANDROID_HOME"
          else
            echo "⚠️  sdkmanager not found — trying cmdline-tools"
            CMDLINE="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [ -f "$CMDLINE" ]; then
              yes | "$CMDLINE" --licenses > /dev/null 2>&1 || true
              "$CMDLINE" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
              echo "✅ SDK licenses accepted via cmdline-tools"
            else
              echo "❌ No sdkmanager found at $ANDROID_HOME"
            fi
          fi
      - name: Verify twa-manifest packageId
        script: |
          MANIFEST_ID=$(grep -o '"packageId"[[:space:]]*:[[:space:]]*"[^"]*"' ./src/twa-manifest.json | head -1 | sed 's/.*: *//;s/"//g')
          if [ "$MANIFEST_ID" != "$PACKAGE_ID" ]; then
            echo "⚠️  twa-manifest packageId is '$MANIFEST_ID' — fixing to '$PACKAGE_ID'"
            sed -i "s/\"packageId\"[[:space:]]*:[[:space:]]*\"[^\"]*\"/\"packageId\": \"$PACKAGE_ID\"/g" ./src/twa-manifest.json
          else
            echo "✅ twa-manifest packageId already correct: $PACKAGE_ID"
          fi
      - name: Copy twa-manifest to working directory
        script: |
          cp ./src/twa-manifest.json ./twa-manifest.json
      - name: Set up signing keystore
        script: |
          # Use Codemagic code signing keystore if available (CM_KEYSTORE).
          # This ensures the SAME signing key is used across all builds — required by Google Play.
          # If CM_KEYSTORE is not set, generate a self-signed keystore (download from artifacts
          # and upload to Codemagic → Code Signing → Android for future builds).
          KEYSTORE_PASS="${CM_KEYSTORE_PASSWORD:-nalichat-store}"
          KEY_PASS="${CM_KEY_PASSWORD:-$KEYSTORE_PASS}"
          KEY_ALIAS="${CM_KEY_ALIAS:-$KEYSTORE_ALIAS}"
          rm -f ./android.keystore
          if [ -n "$CM_KEYSTORE" ] && [ -f "$CM_KEYSTORE" ]; then
            echo "🔑 Using Codemagic code signing keystore: $CM_KEYSTORE"
            cp "$CM_KEYSTORE" ./android.keystore
          else
            echo "⚠️  No CM_KEYSTORE found — generating a self-signed keystore"
            echo "📌 Download android.keystore from build artifacts and upload to"
            echo "    Codemagic → Code Signing → Android for consistent future builds"
            keytool -genkeypair -v \
              -keystore ./android.keystore \
              -alias "$KEY_ALIAS" \
              -storetype JKS \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=NaliChat, OU=Mobile, O=NaliChat, L=Indianapolis, ST=IN, C=US"
            if [ $? -ne 0 ]; then
              echo "❌ keytool failed to generate keystore"
              exit 1
            fi
          fi
          # Verify the keystore can be read with the expected passwords
          keytool -list -keystore ./android.keystore -storepass "$KEYSTORE_PASS" -alias "$KEY_ALIAS" || {
            echo "❌ Cannot read keystore — check CM_KEYSTORE_PASSWORD / CM_KEY_ALIAS in code signing settings"
            exit 1
          }
          echo "✅ Keystore ready at ./android.keystore (alias: $KEY_ALIAS)"
          # Persist passwords for subsequent steps via $CM_ENV
          echo "export KEYSTORE_PASS='$KEYSTORE_PASS'" >> "$CM_ENV"
          echo "export KEY_PASS='$KEY_PASS'" >> "$CM_ENV"
          echo "export KEY_ALIAS='$KEY_ALIAS'" >> "$CM_ENV"
      - name: Update twa-manifest signing key paths
        script: |
          sed -i "s|\"path\"[[:space:]]*:[[:space:]]*\"[^\"]*\"|\"path\": \"./android.keystore\"|g" ./twa-manifest.json
          sed -i "s|\"alias\"[[:space:]]*:[[:space:]]*\"[^\"]*\"|\"alias\": \"$KEYSTORE_ALIAS\"|g" ./twa-manifest.json
          echo "✅ Signing key path and alias updated in twa-manifest.json"
      - name: Configure Bubblewrap JDK and Android SDK paths
        script: |
          bubblewrap updateConfig \
            --jdkPath="$JAVA_HOME" \
            --androidSdkPath="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$ANDROID_SDK}}"
          echo "✅ Bubblewrap config updated with JDK and Android SDK paths"
      - name: Bubblewrap update (regenerate Gradle project)
        script: |
          # Let bubblewrap install its own JDK — avoids path prompt infinite loop
          KEYSTORE_PASS="${KEYSTORE_PASS:-${CM_KEYSTORE_PASSWORD:-nalichat-store}}"
          KEY_PASS="${KEY_PASS:-${CM_KEY_PASSWORD:-$KEYSTORE_PASS}}"
          expect << EOF 2>&1 | tee /tmp/bubblewrap_update.log
            set timeout 1800
            log_user 1
            spawn bubblewrap update --skip-gradle-build
            expect {
              # Answer only the exact JDK installation question. Avoid broad
              # yes/no matches that could enqueue input for later prompts.
              "Do you want Bubblewrap to install the JDK" { send "y\r"; exp_continue }
              "Do you want Bubblewrap to install the Android SDK" { send "y\r"; exp_continue }
              "Do you agree to the Android SDK terms and conditions" { send "y\r"; exp_continue }
              "Password for the Key Store" { send "$KEYSTORE_PASS\r"; exp_continue }
              "Password for the Key" { send "$KEY_PASS\r"; exp_continue }
              "Keystore password" { send "$KEYSTORE_PASS\r"; exp_continue }
              "Key password" { send "$KEY_PASS\r"; exp_continue }
              timeout {
                puts "\n❌ Timed out after 1800s — check /tmp/bubblewrap_update.log"
                exit 1
              }
              eof
            }
          EOF
          UPDATE_EXIT=$?
          if [ $UPDATE_EXIT -ne 0 ]; then
            echo "=== Last 50 lines of update log ==="
            tail -50 /tmp/bubblewrap_update.log
            exit 1
          fi
      - name: Enforce applicationId in Gradle files
        script: |
          fix_gradle_file() {
            local FILE="$1"
            if [ ! -f "$FILE" ]; then return; fi
            echo "=== Checking $FILE ==="
            if [[ "$FILE" == *.kts ]]; then
              # Kotlin DSL: applicationId = "..." and namespace = "..."
              sed -i -E "s/applicationId[[:space:]]*=[[:space:]]*[\"'][^\"']*[\"']/applicationId = \"$PACKAGE_ID\"/g" "$FILE"
              sed -i -E "s/namespace[[:space:]]*=[[:space:]]*[\"'][^\"']*[\"']/namespace = \"$PACKAGE_ID\"/g" "$FILE"
            else
              # Groovy DSL: applicationId "..." and namespace "..."
              sed -i -E "s/applicationId[[:space:]]*[\"'][^\"']*[\"']/applicationId \"$PACKAGE_ID\"/g" "$FILE"
              sed -i -E "s/namespace[[:space:]]*[\"'][^\"']*[\"']/namespace \"$PACKAGE_ID\"/g" "$FILE"
            fi
            echo "  After fix:"
            grep -n -E "applicationId|namespace" "$FILE" || echo "  (none found)"
          }
          fix_gradle_file "./app/build.gradle"
          fix_gradle_file "./app/build.gradle.kts"
          # Also fix AndroidManifest.xml package attribute if present
          for MANIFEST in $(find . -name "AndroidManifest.xml" 2>/dev/null); do
            if [ -f "$MANIFEST" ] && grep -q 'package="' "$MANIFEST"; then
              echo "=== Fixing package attribute in $MANIFEST ==="
              sed -i -E "s/package=\"[^\"]*\"/package=\"$PACKAGE_ID\"/g" "$MANIFEST"
            fi
          done
      - name: Enforce minSdkVersion 21 in Gradle files
        script: |
          # androidbrowserhelper 2.6.2 requires minSdk 21 — bubblewrap may generate 19
          # Handle both Groovy (minSdk 19 / minSdkVersion 19) and Kotlin DSL (minSdk = 19)
          for GRADLE in $(find . -name "build.gradle" -o -name "build.gradle.kts" 2>/dev/null); do
            if [ -f "$GRADLE" ]; then
              echo "=== Checking $GRADLE ==="
              grep -n -E "minSdk" "$GRADLE" || echo "  (no minSdk found)"
              # Fix all minSdk/minSdkVersion patterns: space or = separator
              sed -i -E "s/(minSdkVersion[[:space:]]*=?[[:space:]]*)[0-9]+/\121/g" "$GRADLE"
              sed -i -E "s/(minSdk[[:space:]]*=?[[:space:]]*)[0-9]+/\121/g" "$GRADLE"
              echo "  After fix:"
              grep -n -E "minSdk" "$GRADLE" || echo "  (no minSdk found)"
            fi
          done
          # Also fix AndroidManifest.xml if it has minSdkVersion
          for MANIFEST in $(find . -name "AndroidManifest.xml" 2>/dev/null); do
            if [ -f "$MANIFEST" ] && grep -q 'minSdkVersion' "$MANIFEST"; then
              echo "=== Fixing $MANIFEST ==="
              sed -i -E 's/android:minSdkVersion="[0-9]+"/android:minSdkVersion="21"/g' "$MANIFEST"
              echo "  After fix:"
              grep -n 'minSdkVersion' "$MANIFEST" || echo "  (no minSdkVersion found)"
            fi
          done
      - name: Configure Gradle signing config
        script: |
          KEYSTORE_PASS="${KEYSTORE_PASS:-${CM_KEYSTORE_PASSWORD:-nalichat-store}}"
          KEY_PASS="${KEY_PASS:-${CM_KEY_PASSWORD:-$KEYSTORE_PASS}}"
          KEY_ALIAS="${KEY_ALIAS:-${CM_KEY_ALIAS:-$KEYSTORE_ALIAS}}"
          GRADLE_FILE=""
          for f in ./app/build.gradle ./app/build.gradle.kts; do
            if [ -f "$f" ]; then GRADLE_FILE="$f"; break; fi
          done
          if [ -z "$GRADLE_FILE" ]; then
            echo "⚠️  No app/build.gradle found — skipping signing config injection"
            exit 0
          fi
          echo "=== Configuring signing in $GRADLE_FILE ==="
          echo "=== Current signing config ==="
          grep -n -A 10 "signingConfig" "$GRADLE_FILE" 2>/dev/null || echo "  (none found)"
          # Use Python to reliably inject the signing config into the Gradle file
          export KEYSTORE_PASS KEY_PASS KEY_ALIAS GRADLE_FILE
          python3 << 'PYEOF'
          import os, re
          gf = os.environ['GRADLE_FILE']
          kp, kpw, ka = os.environ['KEYSTORE_PASS'], os.environ['KEY_PASS'], os.environ['KEY_ALIAS']
          is_kts = gf.endswith('.kts')
          with open(gf, 'r') as f:
              content = f.read()
          content = re.sub(r'\s*signingConfigs\s*\{(?:[^{}]|\{[^{}]*\})*\}', '', content, flags=re.DOTALL)
          if is_kts:
              sc = '\n    signingConfigs {\n        create("release") {\n            storeFile = file("../android.keystore")\n            storePassword = "%s"\n            keyAlias = "%s"\n            keyPassword = "%s"\n        }\n    }\n' % (kp, ka, kpw)
              rsc = 'signingConfig = signingConfigs.getByName("release")'
          else:
              sc = "\n    signingConfigs {\n        release {\n            storeFile file('../android.keystore')\n            storePassword '%s'\n            keyAlias '%s'\n            keyPassword '%s'\n        }\n    }\n" % (kp, ka, kpw)
              rsc = 'signingConfig signingConfigs.release'
          if 'buildTypes {' in content:
              content = content.replace('buildTypes {', sc + '    buildTypes {', 1)
          else:
              content += sc
          if rsc not in content:
              content = re.sub(r'(buildTypes\s*\{[\s\S]*?release\s*\{)', lambda m: m.group(1) + '\n            ' + rsc, content, count=1)
          with open(gf, 'w') as f:
              f.write(content)
          print(f"Signing config injected into {gf}")
          PYEOF
          echo "=== Updated signing config ==="
          grep -n -A 10 "signingConfig" "$GRADLE_FILE" 2>/dev/null || echo "  (none found after injection)"
      - name: Fix local.properties SDK path
        script: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/share/android-sdk}}"
          if [ -f "./local.properties" ]; then
            sed -i "s|sdk.dir=.*|sdk.dir=$ANDROID_HOME|" ./local.properties
          else
            echo "sdk.dir=$ANDROID_HOME" > ./local.properties
          fi
          echo "✅ local.properties SDK path set to: $ANDROID_HOME"
      - name: Build AAB
        script: |
          export CI=true
          # Use the keystore from the "Set up signing keystore" step — do NOT regenerate it.
          # Regenerating would produce a different signing key each build, breaking Play Store updates.
          KEYSTORE_PASS="${KEYSTORE_PASS:-${CM_KEYSTORE_PASSWORD:-nalichat-store}}"
          KEY_PASS="${KEY_PASS:-${CM_KEY_PASSWORD:-$KEYSTORE_PASS}}"
          KEY_ALIAS="${KEY_ALIAS:-${CM_KEY_ALIAS:-$KEYSTORE_ALIAS}}"
          # Verify keystore exists and is readable
          if [ ! -f ./android.keystore ]; then
            echo "❌ android.keystore not found — aborting"
            exit 1
          fi
          keytool -list -keystore ./android.keystore -storepass "$KEYSTORE_PASS" -alias "$KEY_ALIAS" || {
            echo "❌ Cannot read keystore — check CM_KEYSTORE_PASSWORD / CM_KEY_ALIAS"
            exit 1
          }
          echo "✅ Keystore verified, starting signed Gradle bundle build"
          # Bubblewrap prompts for keystore/key passwords interactively — handle them via expect
          set +e
          expect << EOF 2>&1 | tee /tmp/bubblewrap_build.log
            set timeout 1800
            log_user 1
            spawn sh -c {chmod +x ./gradlew && ./gradlew clean bundleRelease --no-daemon}
            expect {
              # Gradle signing prompts only; no broad yes/no matches that can
              # queue stray input before a password request.
              "Password for the Key Store" { send "$KEYSTORE_PASS\r"; exp_continue }
              "Password for the Key" { send "$KEY_PASS\r"; exp_continue }
              "Keystore password" { send "$KEYSTORE_PASS\r"; exp_continue }
              "Key password" { send "$KEY_PASS\r"; exp_continue }
              timeout {
                puts "\n❌ Timed out after 1800s — check /tmp/bubblewrap_build.log"
                exit 1
              }
              eof
            }
            catch wait result
            exit [lindex \$result 3]
          EOF
          BUILD_EXIT=${PIPESTATUS[0]}
          echo ""
          echo "=== Gradle bundle build exit code: $BUILD_EXIT ==="
          echo "=== Looking for AAB files ==="
          find . -name "*.aab" -type f 2>/dev/null || echo "No AAB found"
          echo "=== Build output directory ==="
          ls -la ./app/build/outputs/bundle/release/ 2>/dev/null || echo "No bundle output directory"
          echo "=== Last 200 lines of build log ==="
          tail -200 /tmp/bubblewrap_build.log
          echo ""
          echo "=== Extracted error messages ==="
          grep -i -A 5 "FAILURE\|What went wrong\|Could not\|Cannot\|Error\|Exception\|failed" /tmp/bubblewrap_build.log | head -60
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "❌ Gradle bundle build failed with exit code $BUILD_EXIT"
            exit 1
          fi
          AAB_FILE=$(find ./app/build/outputs/bundle/release -name "*.aab" -type f 2>/dev/null | head -1)
          if [ -z "$AAB_FILE" ]; then
            echo "❌ No AAB found to sign"
            exit 1
          fi
          echo "🔐 Signing AAB with the verified NaliChat keystore: $AAB_FILE"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore ./android.keystore \
            -storepass "$KEYSTORE_PASS" \
            -keypass "$KEY_PASS" \
            "$AAB_FILE" "$KEY_ALIAS"
          jarsigner -verify -verbose -certs "$AAB_FILE" | grep -q "jar verified" || {
            echo "❌ AAB signature verification failed immediately after signing"
            exit 1
          }
          echo "✅ AAB signed and verified"
          cp "$AAB_FILE" ./app-release-bundle.aab
          echo "✅ Signed AAB promoted to ./app-release-bundle.aab"
      - name: Verify AAB package name
        script: |
          # Use the exact Gradle bundle that was signed in the prior step.
          AAB_FILE="./app/build/outputs/bundle/release/app-release.aab"
          if [ -z "$AAB_FILE" ]; then
            echo "❌ AAB file not found — searching for any build outputs..."
            find . -name "*.aab" -o -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          echo "✅ Found AAB at: $AAB_FILE"
          # Copy to root for artifacts collection
          cp "$AAB_FILE" ./app-release-bundle.aab
          TMP_DIR=$(mktemp -d)
          unzip -o "$AAB_FILE" "base/manifest/AndroidManifest.xml" -d "$TMP_DIR" 2>/dev/null || true
          MANIFEST_XML="$TMP_DIR/base/manifest/AndroidManifest.xml"
          if [ -f "$MANIFEST_XML" ]; then
            AAB_PACKAGE=$(strings "$MANIFEST_XML" | grep -i "$PACKAGE_ID" | head -1)
            if echo "$AAB_PACKAGE" | grep -q "$PACKAGE_ID"; then
              echo "✅ Package name in AAB: $PACKAGE_ID"
            else
              echo "⚠️  Could not verify $PACKAGE_ID in binary manifest (proceeding)"
            fi
          fi
          rm -rf "$TMP_DIR"
      - name: Verify AAB is signed
        script: |
          AAB_FILE="./app-release-bundle.aab"
          if [ ! -f "$AAB_FILE" ]; then
            AAB_FILE=$(find . -name "*.aab" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$AAB_FILE" ]; then
            echo "❌ No AAB found to verify signing"
            exit 1
          fi
          echo "🔐 Verifying AAB signing: $AAB_FILE"
          # jarsigner checks the signature on the AAB
          if jarsigner -verify -verbose -certs "$AAB_FILE" 2>&1 | grep -q "jar verified"; then
            echo "✅ AAB is SIGNED and verified"
          else
            echo "❌ jarsigner verification failed:"
            jarsigner -verify -verbose "$AAB_FILE" 2>&1 | tail -20
            exit 1
          fi
          # Print the signing certificate fingerprint for comparison
          keytool -printcert -jarfile "$AAB_FILE" 2>/dev/null | grep -E "Owner|Issuer|SHA256" || echo "  (no cert info found)"
      - name: Build APK for direct download
        script: |
          # Build a release APK for direct download (sideloading outside Play Store)
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/share/android-sdk}}"
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          APK_FILE=$(find . -name "*.apk" -path "*/release/*" -type f 2>/dev/null | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ APK not found — build may have failed"
            exit 1
          fi
          cp "$APK_FILE" ./app-release.apk
          echo "✅ APK built at ./app-release.apk"
          ls -lh ./app-release.apk
      - name: Publish Android artifacts to GitHub Releases
        script: |
          # Upload the APK to the SAME fixed release used by Windows/macOS/the
          # in-app Download page, instead of creating a new timestamped release
          # on every run. `gh release create` with a fresh tag each time made
          # THAT new release "latest" (GitHub's "latest" is whichever release is
          # newest), which would silently 404 the Windows/macOS download links
          # on the Download page the next time this job ran after either of
          # those had been published. Requires GH_TOKEN (repo scope).
          if [ -z "$GH_TOKEN" ]; then
            echo "⚠️  GH_TOKEN not set — skipping GitHub Release upload"
            echo "📌 Set GH_TOKEN in Codemagic environment variables to enable direct APK download"
            exit 0
          fi
          RELEASE_TAG="1.0.0"
          gh release upload "$RELEASE_TAG" \
            ./app-release.apk \
            ./app-release-bundle.aab \
            --clobber \
            || {
              echo "❌ GitHub Release upload failed — artifacts remain available in Codemagic"
              exit 1
            }
          echo "✅ APK and signed AAB published to GitHub Releases: $RELEASE_TAG"
    artifacts:
      - app-release-bundle.aab
      - ./app/build/outputs/bundle/release/*.aab
      - app-release.apk
      - ./app/build/outputs/apk/release/*.apk
      - android.keystore

    # Google Play publishing is OPT-IN and safe by default. It requires ONE
    # new variable, GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS, which you add
    # yourself in Codemagic (Team settings > Environment variable groups, or
    # any existing group such as keystore_credentials - the name of the group
    # doesn't matter, only the variable name does). Full walkthrough in
    # GOOGLE_PLAY_PUBLISHING.md.
    #
    # Until that variable exists, this stage runs after the build above and
    # fails/skips on its own without affecting the AAB build or the GitHub
    # Release upload, since those already completed in `scripts:` before this
    # runs. track: internal + submit_as_draft: true are deliberate: even once
    # this is fully configured, nothing reaches real users or goes live in the
    # Play Store automatically - you still promote it yourself from the
    # internal testing track in Play Console when you're ready.
    #
    # IMPORTANT: Google Play does not allow API-based publishing for a brand
    # new app's first-ever release. If this is the app's first submission to
    # Play, you must create the app listing and upload that first version
    # manually through the Play Console web UI - this automation only works
    # for updates after that.
  # NOTE: the macOS DMG and Windows EXE builds that used to live here were
  # moved to .github/workflows/desktop-builds.yml.
  #
  # The Windows job cross-compiled via Wine on a macOS instance, which
  # produced an installer whose bundled NSIS "System" plugin crashed with an
  # access violation (0xC0000005) the moment a real Windows machine ran it —
  # confirmed by installing the published .exe and inspecting the Windows
  # Error Reporting event log. Wine's Win32 API emulation is not reliable
  # enough for NSIS's System plugin; the fix is building natively on a real
  # Windows machine, which Codemagic does not provide (mobile-focused CI —
  # only macOS/Linux instance types).
  #
  # Both jobs also used to `gh release create` a brand-new, uniquely-tagged
  # release on every run instead of updating the existing one. Since GitHub's
  # "latest" release is whichever is newest, a fresh single-platform release
  # would immediately break the download links for whichever platform didn't
  # just build. The GitHub Actions workflow instead uploads with `--clobber`
  # to one fixed release tag shared by all three platforms.
