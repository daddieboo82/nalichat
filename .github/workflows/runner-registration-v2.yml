name: NaliChat Runner Registration V2

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  registration:
    name: Fresh runner registration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner alive
        shell: bash
        run: |
          printf '%s\n' 'fresh-runner-registration-v2-ok'
