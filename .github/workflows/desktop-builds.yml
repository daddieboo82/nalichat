name: Desktop Builds

# Builds the Electron desktop wrapper for Windows and macOS and publishes the
# installers to the existing GitHub release used by the in-app Download page.
# Push dispatch is temporarily disabled while GitHub Actions registration is
# isolated under issue #1025. Manual dispatch remains available.

on:
  workflow_dispatch:

env:
  RELEASE_TAG: '1.0.0'

jobs:
  windows-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Electron dependencies
        working-directory: electron
        run: npm install

      - name: Build Windows installer (NSIS)
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis

      - name: Verify the installer actually installs
        shell: pwsh
        run: |
          $exe = Get-ChildItem electron/dist -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "No .exe produced" }
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList "/S" -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) { throw "Installer exited with code $($proc.ExitCode)" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\NaliChat\NaliChat.exe")) { throw "App was not installed" }
          Write-Host "Installer verified OK"

      - name: Publish EXE to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          EXE_FILE=$(find ./electron/dist -maxdepth 1 -name "*.exe" -type f | head -1)
          if [ -z "$EXE_FILE" ]; then
            echo "No EXE found"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "$EXE_FILE" --clobber --repo "${{ github.repository }}"
          echo "Published $EXE_FILE to release $RELEASE_TAG"

  macos-dmg:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Electron dependencies
        working-directory: electron
        run: npm install

      - name: Build macOS DMG (signed + notarized if secrets are configured)
        working-directory: electron
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "MAC_CERTIFICATE_P12_BASE64 secret not set - building unsigned, as before."
            echo "See electron/CODESIGNING.md to enable signing + notarization."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          else
            echo "Signing certificate found - building signed."
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              echo "Apple notarization credentials found - notarization will run after signing."
            else
              echo "Apple notarization credentials incomplete - building signed but not notarized."
            fi
          fi
          npx electron-builder --mac dmg

      - name: Publish DMG to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          DMG_FILE=$(find ./electron/dist -maxdepth 1 -name "*.dmg" -type f | head -1)
          if [ -z "$DMG_FILE" ]; then
            echo "No DMG found"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "$DMG_FILE" --clobber --repo "${{ github.repository }}"
          echo "Published $DMG_FILE to release $RELEASE_TAG"
